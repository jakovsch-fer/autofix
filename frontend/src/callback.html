<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>AutoServis - Prijava</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>AutoServis</h1>
<p id="poruka">Prijava u tijeku...</p>
<script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.0.1/dist/browser/oidc-client-ts.min.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function zavrsi() {
  try {
    const korisnik = await um().signinRedirectCallback();
    spremiToken(korisnik.id_token);
    if (CONFIG.USE_MOCK) prijaviMock(korisnik.profile.email);
  } catch (e) {
    document.getElementById("poruka").textContent = "Prijava nije uspjela: " + e.message;
    return;
  }
  location.href = "index.html"
}
zavrsi();
</script>
</body>
</html>
