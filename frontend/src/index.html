<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<title>AutoServis - Prijava</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>AutoServis</h1>
<h2>Prijava</h2>
<div id="sadrzaj">Učitavanje...</div>
<script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.0.1/dist/browser/oidc-client-ts.min.js"></script>
<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script>
async function provjeri() {
  try {
    const ja = await api("GET", "/users/me");
    location.href = POCETNE[ja.uloga];
  } catch (e) {
    if (e.status === 404) location.href = "registracija.html";
    else if (e.status === 401) {
      $("sadrzaj").innerHTML = '<p><input type="button" value="Prijava putem OAuth 2.0" onclick="um().signinRedirect()"></p>';
      if (CONFIG.USE_MOCK)
        $("sadrzaj").innerHTML += '<p><input type="button" value="Resetiraj mock podatke" onclick="resetirajMock(); return false;"></p>';
      // if (CONFIG.USE_MOCK && !mockId()) {
      //   $("sadrzaj").innerHTML += '<p>Mock način. Prijavi se kao:</p>' +
      //     '<p><input type="button" value="Vlasnik vozila" onclick="prijava(1)"> ' +
      //     '<input type="button" value="Serviser" onclick="prijava(2)"> ' +
      //     '<input type="button" value="Voditelj" onclick="prijava(4)"> ' +
      //     '<input type="button" value="Nova registracija" onclick="prijavaNovi()"></p>' +
      //     '<p><a href="#" onclick="resetirajMock(); return false;">Resetiraj mock podatke</a></p>';
      // } else {
      //   location.href = POCETNE[ja.uloga];
      // }
    }
    else document.getElementById("poruka").textContent = e.message;
  }
}

async function prijava(id) {
  try {
    const ja = await api("POST", "/mock-login", { id: id });
    location.href = POCETNE[ja.uloga];
  } catch (e) {
    alert(e.message);
  }
}

async function prijavaNovi() {
  await api("POST", "/mock-login", { novi: true });
  location.href = "registracija.html";
}

provjeri();
</script>
</body>
</html>
